<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Narendra Book Agency</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      background-color: #2c7be5;
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo img {
      height: 40px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .search-box input {
      padding: 10px 15px;
      font-size: 15px;
      width: 280px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    /* ===== SUBJECT CARDS ===== */
    .subjects {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px;
      flex-wrap: wrap;
    }

    .subject-card {
      background: white;
      width: 160px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      overflow: hidden;
    }

    .subject-card:hover {
      transform: scale(1.05);
    }

    .subject-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .subject-card p {
      padding: 10px;
      font-weight: bold;
      margin: 0;
    }

    /* ===== TABLE ===== */
    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #2c7be5;
      color: white;
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #555;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .topbar {
        flex-direction: column;
        text-align: center;
      }

      .search-box input {
        width: 100%;
        max-width: 320px;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <!-- ===== TOP BAR ===== -->
  <div class="topbar">
    <div class="logo">
      <img src="logo.png" alt="Logo">
      <span>Narendra Book Agency</span>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by Book / Author / ISBN..." onkeyup="applyFilters()">
    </div>
  </div>

  <!-- ===== SUBJECT CARDS ===== -->
  <div class="subjects">
    <div class="subject-card" onclick="filterSubject('all')"><p>All Books</p></div>
    <div class="subject-card" onclick="filterSubject('mathematics')"><img src="maths.jpg"><p>Mathematics</p></div>
    <div class="subject-card" onclick="filterSubject('physics')"><img src="physics.jpg"><p>Physics</p></div>
    <div class="subject-card" onclick="filterSubject('computer science')"><img src="cs.jpg"><p>Computer Science</p></div>
  </div>

  <!-- ===== BOOK TABLE ===== -->
  <table>
    <thead>
      <tr>
        <th>Book Name</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Subject</th>
      </tr>
    </thead>
    <tbody id="bookTableBody"></tbody>
  </table>

  <!-- ===== FOOTER ===== -->
  <footer>
    © 2025 Narendra Book Agency | Academic & Research Books
  </footer>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    const books = [
      { name: "Advanced Engineering Mathematics", author: "Erwin Kreyszig", isbn: "9788126515370", subject: "Mathematics" },
      { name: "Quantum Mechanics", author: "David J. Griffiths", isbn: "9781107189638", subject: "Physics" },
      { name: "Introduction to Algorithms", author: "Thomas H. Cormen", isbn: "9780262033848", subject: "Computer Science" }
    ];

    let currentSubject = "all";

    function renderBooks(list) {
      const tbody = document.getElementById("bookTableBody");
      tbody.innerHTML = "";

      list.forEach(book => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${book.name}</td>
          <td>${book.author}</td>
          <td>${book.isbn}</td>
          <td>${book.subject}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function filterSubject(subject) {
      currentSubject = subject;
      applyFilters();
    }

    function applyFilters() {
      const searchText = document.getElementById("searchInput").value.toLowerCase();

      const filtered = books.filter(book => {
        const matchesSearch =
          book.name.toLowerCase().includes(searchText) ||
          book.author.toLowerCase().includes(searchText) ||
          book.isbn.includes(searchText);

        const matchesSubject =
          currentSubject === "all" ||
          book.subject.toLowerCase() === currentSubject;

        return matchesSearch && matchesSubject;
      });

      renderBooks(filtered);
    }

    renderBooks(books);
  </script>

</body>
</html>
