<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Narendra Book Agency</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      background-color: #2c7be5;
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo img {
      height: 40px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .search-box input {
      padding: 10px 15px;
      font-size: 14px;
      width: 260px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    /* ===== SUBJECT CARDS ===== */
    .subjects {
      display: flex;
      gap: 20px;
      padding: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .subject-card {
      background: white;
      width: 160px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .subject-card:hover {
      transform: translateY(-4px);
    }

    .subject-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .subject-card p {
      margin: 10px;
      font-weight: bold;
    }

    /* ===== TABLE (DESKTOP) ===== */
    table {
      width: 95%;
      margin: auto;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #2c7be5;
      color: white;
    }

    /* ===== MOBILE CARDS ===== */
    .mobile-cards {
      display: none;
      padding: 15px;
      gap: 15px;
    }

    .book-card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .book-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .book-card p {
      margin: 4px 0;
      font-size: 14px;
      color: #555;
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #555;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      table {
        display: none;
      }

      .mobile-cards {
        display: grid;
      }

      .search-box input {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- ===== TOP BAR ===== -->
  <div class="topbar">
    <div class="logo">
      <img src="logo.png" alt="Logo" />
      Narendra Book Agency
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by Book / Author / ISBN..."
        onkeyup="applyFilters()"
      />
    </div>
  </div>

  <!-- ===== SUBJECT FILTER ===== -->
  <div class="subjects">
    <div class="subject-card" onclick="filterSubject('all')"><p>All Books</p></div>
    <div class="subject-card" onclick="filterSubject('mathematics')"><img src="maths.jpg"><p>Mathematics</p></div>
    <div class="subject-card" onclick="filterSubject('physics')"><img src="physics.jpg"><p>Physics</p></div>
    <div class="subject-card" onclick="filterSubject('computer science')"><img src="cs.jpg"><p>Computer Science</p></div>
    <div class="subject-card" onclick="filterSubject('electrical engineering')"><p>Electrical Engineering</p></div>
    <div class="subject-card" onclick="filterSubject('information science')"><p>Information Science</p></div>
  </div>

  <!-- ===== MOBILE CARDS ===== -->
  <div id="mobileCards" class="mobile-cards"></div>

  <!-- ===== TABLE ===== -->
  <table>
    <thead>
      <tr>
        <th>Book Name</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Subject</th>
      </tr>
    </thead>
    <tbody id="bookTableBody"></tbody>
  </table>

  <!-- ===== FOOTER ===== -->
  <footer>
    © 2025 Narendra Book Agency | Academic & Research Books
  </footer>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    const books = [
      { name: "Advanced Engineering Mathematics", author: "Erwin Kreyszig", isbn: "9788126515370", subject: "Mathematics" },
      { name: "Quantum Mechanics", author: "David J. Griffiths", isbn: "9781107189638", subject: "Physics" },
      { name: "Introduction to Algorithms", author: "Thomas H. Cormen", isbn: "9780262033848", subject: "Computer Science" },
      { name: "Power Electronics", author: "M.H. Rashid", isbn: "9780133125900", subject: "Electrical Engineering" },
      { name: "Information Systems", author: "Laudon", isbn: "9781292403280", subject: "Information Science" }
    ];

    let currentSubject = "all";

    function renderTable(list) {
      const tbody = document.getElementById("bookTableBody");
      tbody.innerHTML = "";
      list.forEach(b => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${b.name}</td>
          <td>${b.author}</td>
          <td>${b.isbn}</td>
          <td>${b.subject}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderMobileCards(list) {
      const container = document.getElementById("mobileCards");
      container.innerHTML = "";
      list.forEach(b => {
        const div = document.createElement("div");
        div.className = "book-card";
        div.innerHTML = `
          <h3>${b.name}</h3>
          <p><strong>Author:</strong> ${b.author}</p>
          <p><strong>ISBN:</strong> ${b.isbn}</p>
          <p><strong>Subject:</strong> ${b.subject}</p>
        `;
        container.appendChild(div);
      });
    }

    function applyFilters() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filtered = books.filter(b => {
        const matchSearch =
          b.name.toLowerCase().includes(search) ||
          b.author.toLowerCase().includes(search) ||
          b.isbn.includes(search);

        const matchSubject =
          currentSubject === "all" ||
          b.subject.toLowerCase() === currentSubject;

        return matchSearch && matchSubject;
      });

      renderTable(filtered);
      renderMobileCards(filtered);
    }

    function filterSubject(subject) {
      currentSubject = subject;
      applyFilters();
    }

    applyFilters();
  </script>

</body>
</html>
