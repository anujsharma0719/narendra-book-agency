<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Narendra Book Agency</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      background-color: #2c7be5;
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo img {
      height: 40px;
    }

    .search-box input {
      padding: 10px 15px;
      font-size: 15px;
      width: 280px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    /* ===== SUBJECT CARDS ===== */
    .subjects {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px;
      flex-wrap: wrap;
    }

    .subject-card {
      background: white;
      width: 160px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      overflow: hidden;
    }

    .subject-card:hover {
      transform: scale(1.05);
    }

    .subject-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .subject-card p {
      padding: 10px;
      font-weight: bold;
      margin: 0;
    }

    /* ===== TABLE ===== */
    <table id="bookTable">
  <thead>
    <tr>
      <th>Book Name</th>
      <th>Author</th>
      <th>ISBN</th>
      <th>Subject</th>
    </tr>
  </thead>

  <tbody id="bookTableBody">
    <!-- JS yahan rows add karega -->
  </tbody>
</table>

/* ===== NAV LINKS ===== */
.nav-links {
  display: flex;
  gap: 20px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.nav-links a:hover {
  text-decoration: underline;
}
    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #555;
    }
    @media (max-width: 768px) {
  .topbar {
    flex-direction: column;
    gap: 10px;
    padding: 15px;
    text-align: center;
  }

  .logo {
    justify-content: center;
    font-size: 18px;
  }

  .nav-links {
    justify-content: center;
  }

  .search-box input {
    width: 100%;
    max-width: 320px;
  }

  table {
    display: block;
    overflow-x: auto;
    width: 100%;
  }
}

  </style>
</head>

<body>

  <!-- ===== TOP BAR ===== -->
  <div class="topbar">
  <div class="logo">
    <img src="logo.png" alt="Logo">
    <span>Narendra Book Agency</span>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
  </div>

  <div class="search-box">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search by Book / Author / ISBN..."
      onkeyup="searchBooks()">
  </div>
</div>

  <!-- ===== SUBJECT CARDS ===== -->
  <div class="subjects">

    <div class="subject-card" onclick="filterSubject('all')">
      <p>All Books</p>
    </div>

    <div class="subject-card" onclick="filterSubject('mathematics')">
      <img src="maths.jpg">
      <p>Mathematics</p>
    </div>

    <div class="subject-card" onclick="filterSubject('physics')">
      <img src="physics.jpg">
      <p>Physics</p>
    </div>

    <div class="subject-card" onclick="filterSubject('computer science')">
      <img src="cs.jpg">
      <p>Computer Science</p>
    </div>

  </div>

  <!-- ===== BOOK TABLE ===== -->
  <table id="bookTable">
    <tr>
      <th>Book Name</th>
      <th>Author</th>
      <th>ISBN</th>
      <th>Subject</th>
    </tr>

   <table id="bookTable">
  <thead>
    <tr>
      <th>Book Name</th>
      <th>Author</th>
      <th>ISBN</th>
      <th>Subject</th>
    </tr>
  </thead>
  <tbody id="bookTableBody">
  </tbody>
</table>

  <!-- ===== FOOTER ===== -->
  <footer>
    © 2025 Narendra Book Agency | Academic & Research Books
  </footer>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    let currentSubject = "all";

    function searchBooks() {
      applyFilters();
    }

    function filterSubject(subject) {
      currentSubject = subject;
      applyFilters();
    }

    function applyFilters() {
      let searchText = document.getElementById("searchInput").value.toLowerCase();
      let rows = document.getElementById("bookTable").getElementsByTagName("tr");

      for (let i = 1; i < rows.length; i++) {
        let rowText = rows[i].innerText.toLowerCase();
        let subjectCell = rows[i].getElementsByTagName("td")[3].innerText.toLowerCase();

        let matchesSearch = rowText.includes(searchText);
        let matchesSubject = currentSubject === "all" || subjectCell === currentSubject;

        rows[i].style.display = (matchesSearch && matchesSubject) ? "" : "none";
      }
    }
  </script>

</body>
</html>
